[project]
name = "kt-gen"
version = "0.1.0"
description = ""
authors = [
    {name = "Yanis Dziki",email = "yanis.dziki@ens-lyon.fr"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "streamlit (>=1.45.0,<2.0.0)",
    "networkx (>=3.4.2,<4.0.0)",
    "numpy (>=2.2.5,<3.0.0)",
    "sentence-transformers (>=4.1.0,<5.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "scikit-learn (>=1.6.1,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pot (>=0.9.5,<0.10.0)",
    "requests (>=2.32.3,<3.0.0)",
    "huggingface-hub (>=0.30.2,<0.31.0)",
    "spacy (>=3.8.5,<4.0.0)",
    "faiss-cpu (>=1.11.0,<2.0.0)",
    "openai (>=1.77.0,<2.0.0)",
    "pyvis (>=0.3.2,<0.4.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]

[tool.poetry]
packages = [{include = "kt_gen", from = "src"}]

[tool.poetry.scripts]
kt_gen = "kt_gen.st_app:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
